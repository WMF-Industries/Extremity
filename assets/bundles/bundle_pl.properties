# Wiadomość powitalna wyświetlana po załadowaniu świata
extremity-welcome = [stat]Witaj!\
  \nTa przypominajka wyświetla się jako iż Extremity może nadal być aktywne\
  \nSprawdź ustawienia moda jeżeli chcesz go wyłączyć, lub coś zmienić!

# Wiadomość powitalna wysyłana graczom bez moda
net.extremity-welcome = [stat]Witaj!\
  \n[lightgray]Host używa [scarlet]Extremity[], czyli moda utrudniającego grę stworzonego przez [green]W[orange]M[brown]F[][][]!\
  \nRozważ instalację [stat]Extremity[] aby zwiększyć kompatybilność z hostem!

# Przypominajki
net.extremity-active = [stat][Extremity][]: [lightgray]Przypominajka - skalowanie trudności oraz modyfikatory mogą być aktywne\
  \nSprawdź aktualne ustawienia używając [lime]/difficulty[] i [lime]/modifiers
net.extremity-modifiers = [stat][Extremity][]: [lightgray]Przypominajka - niektóre modyfikatory mogą być aktywne\
  \nSprawdź aktualny stan modyfikatorów używając [lime]/modifiers

# Wiadomość wyświetlana podczas pierwszego uruchomienia
extremity-info = [stat]Witaj w Extremity![]\
  \n\nTen mod stara się [scarlet]utrudnić grę bez modyfikowania czy dodawania kontentu, zamiast tego, dodaje nowe zachowania gry.\
  \n\nCzęść nowych zachowań jest dość cieżka, dlatego [stat]Extremity[] przeznaczona jest dla wydajniejszych urządzeń.\
  \nSłabsze urządzenia mogą mieć problemy z wydajnością, bugi lub nawet wywoływać crashe!\
  \n\nPrzejdź do ustawień [stat]Extremity[] aby dopasować moda pod siebie, miłej gry!

